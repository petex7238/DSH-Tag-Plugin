name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser driver
        run: npm install --no-audit --no-fund

      # The product UI (and the harness fixtures) are CJK. Without a CJK font
      # the runner renders tofu with different metrics, which is a needless
      # source of geometry differences from a real machine.
      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # GitHub's ubuntu images ship Google Chrome at /usr/bin/google-chrome,
      # which the harness picks up on its own. Set CHROME_PATH to override.
      - name: Run the harness
        run: npm test
