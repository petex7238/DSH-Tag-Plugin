name: publish

# Publishes this package to npm from GitHub's runners, so publishing does not
# depend on the local machine's network or npm login.
#
# One-time setup:
#   1. https://www.npmjs.com/settings/<you>/tokens → Generate New Token →
#      **Granular Access Token** with Read and write (npm now requires this for
#      direct publishing; classic tokens and web-login sessions are refused).
#   2. This repository → Settings → Secrets and variables → Actions →
#      New repository secret → name `NPM_TOKEN`, value the token.
#   3. Either publish a GitHub Release, or run this workflow manually.
#
# Note: the secret is checked inside `run:` on purpose — the `secrets` context
# is not available in a step's `if:`, and using it there makes the whole
# workflow invalid (GitHub then shows the file path instead of the name and
# creates a zero-job failed run on every push).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Require the NPM_TOKEN secret
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Missing the NPM_TOKEN secret. Create a Granular Access Token (Read and write) at https://www.npmjs.com/settings/~your-user~/tokens and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
